---
name: CI

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'LICENSE'

env:
  ANSIBLE_ROLES_PATH: $RUNNER_TEMP/roles
  ANSIBLE_RETRY_FILES_ENABLED: false
  ANSIBLE_PIPELINING: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: Set up role locally
        run: |
          mkdir -p "$RUNNER_TEMP/roles"
          ln -s "${{ github.workspace }}" "$RUNNER_TEMP/roles/oatakan.rhel_upgrade"

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Set up role locally
        run: |
          mkdir -p "$RUNNER_TEMP/roles"
          ln -s "${{ github.workspace }}" "$RUNNER_TEMP/roles/oatakan.rhel_upgrade"

      - name: Syntax check
        run: |
          ansible-playbook -i tests/inventory tests/test.yml --syntax-check

  ci-success:
    runs-on: ubuntu-latest
    needs: [lint, syntax-check]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.syntax-check.result }}" == "success" ]]; then
            echo "All CI checks passed"
          else
            echo "CI checks failed"
            echo "- Lint: ${{ needs.lint.result }}"
            echo "- Syntax: ${{ needs.syntax-check.result }}"
            exit 1
          fi
