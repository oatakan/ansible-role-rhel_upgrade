---

- name: fix CentOS EOL
  ansible.builtin.include_tasks: centos_eol_fix.yml
  when:
    - ansible_distribution == 'CentOS'
    - centos_eol_vault_fix|bool

- name: set pre update os_info
  ansible.builtin.set_fact:
    os_info_pre_update:
      distribution: "{{ ansible_distribution }}"
      distribution_major_version: "{{ ansible_distribution_major_version }}"
      distribution_release: "{{ ansible_distribution_release }}"
      distribution_version: "{{ ansible_distribution_version }}"

- name: current OS version information
  ansible.builtin.debug:
    msg: "{{ os_info_pre_update }}"

- name: gather the package facts
  ansible.builtin.package_facts:
  register: packages_list_pre_update
  when: not (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Gather installed RPMs before update (native EL8)
  ansible.builtin.command:
    argv: [/usr/bin/rpm, -qa, --qf, "%{NAME}\t%{EPOCHNUM}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\n"]
  register: native_packages_pre_update
  changed_when: false
  check_mode: false
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: packages before update
  ansible.builtin.debug:
    msg: "{{ packages_list_pre_update }}"
    verbosity: 3

- name: ensure deltarpm installed
  ansible.builtin.package:
    name: deltarpm
    state: present
  become: true
  when: ansible_distribution_major_version|int < 8

- name: check for missing updates (dnf)
  ansible.builtin.dnf:
    list: updates
  become: true
  register: available_updates
  when:
    - ansible_distribution_major_version|int >= 8
    - not (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Check for missing updates (native EL8)
  ansible.builtin.command:
    argv: [dnf, check-update]
  environment:
    LC_ALL: C
  become: true
  register: native_available_updates
  changed_when: false
  failed_when: native_available_updates.rc not in [0, 100]
  check_mode: false
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Show available native updates
  ansible.builtin.debug:
    var: native_available_updates.stdout_lines
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: check for missing updates (yum)
  ansible.builtin.yum: # noqa fqcn[action-core]
    list: updates
  become: true
  register: available_updates
  when: ansible_distribution_major_version|int < 8

- name: show available updates
  ansible.builtin.debug:
    msg: "{{ _msg.split('\n')[:-1] }}"
  vars:
    _msg: |
      {{ inventory_hostname }} has {{ available_updates.results | length }} updates available.
      {% for update in available_updates.results %}
        - {{ update.name }}-{{ update.version }}
      {% endfor %}
  when: available_updates.results is defined

- name: Update packages through the existing module path
  ansible.builtin.include_tasks: update.yml
  when: not (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Update packages through native EL8 DNF
  ansible.builtin.include_tasks: update_native_el8.yml
  when: use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8

- name: check for missing updates (dnf)
  ansible.builtin.dnf:
    list: updates
  become: true
  register: available_updates
  when:
    - ansible_distribution_major_version|int >= 8
    - not (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Check for missing updates (native EL8)
  ansible.builtin.command:
    argv: [dnf, check-update]
  environment:
    LC_ALL: C
  become: true
  register: native_available_updates
  changed_when: false
  failed_when: native_available_updates.rc not in [0, 100]
  check_mode: false
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Show available native updates
  ansible.builtin.debug:
    var: native_available_updates.stdout_lines
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: check for missing updates (yum)
  ansible.builtin.yum: # noqa fqcn[action-core]
    list: updates
  become: true
  register: available_updates
  when: ansible_distribution_major_version|int < 8

- name: show available updates
  ansible.builtin.debug:
    msg: "{{ _msg.split('\n')[:-1] }}"
  vars:
    _msg: |
      {{ inventory_hostname }} has {{ available_updates.results | length }} updates available.
      {% for update in available_updates.results %}
        - {{ update.name }}-{{ update.version }}
      {% endfor %}
  when: available_updates.results is defined

- name: gather the package facts
  ansible.builtin.package_facts:
  register: packages_list_post_update
  when: not (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Gather installed RPMs after update (native EL8)
  ansible.builtin.command:
    argv: [/usr/bin/rpm, -qa, --qf, "%{NAME}\t%{EPOCHNUM}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\n"]
  register: native_packages_post_update
  changed_when: false
  check_mode: false
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Report whether the native package transaction changed installed packages
  ansible.builtin.debug:
    msg: "{{ 'Installed RPMs changed.' if native_el8_packages_changed else 'Installed RPMs match the pre-update state.' }}"
  vars:
    native_el8_packages_changed: >-
      {{
        (native_packages_pre_update.stdout_lines | sort)
        != (native_packages_post_update.stdout_lines | sort)
      }}
  changed_when: native_el8_packages_changed | bool
  when: use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8

- name: Query installed kernels (native EL8)
  ansible.builtin.command:
    argv: [rpm, -q, kernel, --qf, "%{VERSION}-%{RELEASE}.%{ARCH}\n"]
  register: native_kernels
  changed_when: false
  check_mode: false
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: Set latest installed kernel version (native EL8)
  ansible.builtin.set_fact:
    latest_kernel_version: "{{ native_kernels.stdout_lines[-1] }}"
  when: (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)

- name: set latest installed kernel version
  ansible.builtin.set_fact:
    latest_kernel_version: "{{ _version }}-{{ _release }}.{{ _arch }}"
  when: not (use_native_el8_package_tools | bool and ansible_distribution_major_version | int == 8)
  vars:
    _version: "{{ packages_list_post_update.ansible_facts.packages.kernel[-1].version }}"
    _release: "{{ packages_list_post_update.ansible_facts.packages.kernel[-1].release }}"
    _arch: "{{ packages_list_post_update.ansible_facts.packages.kernel[-1].arch }}"

- name: show current kernel version
  ansible.builtin.debug:
    msg: "{{ ansible_kernel }}"

- name: show installed latest kernel version
  ansible.builtin.debug:
    msg: "{{ latest_kernel_version }}"

- name: check if reboot needed
  ansible.builtin.set_fact:
    system_reboot_needed: "{{ ansible_kernel != latest_kernel_version }}"

- name: show if reboot is needed
  ansible.builtin.debug:
    msg: "Reboot needed (kernel): Current:{{ ansible_kernel }} Latest:{{ latest_kernel_version }}"
  when: system_reboot_needed | bool

- name: reboot if needed
  block:
    - name: reboot the system
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"

    - name: gather facts after update
      ansible.builtin.setup:
        filter: ansible_distribution*

    - name: set post update os info
      ansible.builtin.set_fact:
        os_info_post_update:
          distribution: "{{ ansible_distribution }}"
          distribution_major_version: "{{ ansible_distribution_major_version }}"
          distribution_release: "{{ ansible_distribution_release }}"
          distribution_version: "{{ ansible_distribution_version }}"

    - name: OS version information after reboot
      ansible.builtin.debug:
        msg: "{{ os_info_post_update }}"
  when: update_reboot_kernel and system_reboot_needed
